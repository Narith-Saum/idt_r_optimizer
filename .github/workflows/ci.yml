name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    name: Test Python ${{ matrix.python-version }} on ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
        python-version: ["3.9", "3.10", "3.11", "3.12"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install package and test dependencies
        run: python -m pip install -e ".[dev]"
      - name: Check formatting
        run: python -m black --check idt_r/ idt_r_optimizer.py tests/ examples/
      - name: Lint source code
        run: python -m flake8 idt_r/ idt_r_optimizer.py tests/ examples/
      - name: Type-check package
        run: python -m mypy idt_r/ --ignore-missing-imports
      - name: Run test suite
        run: python -m pytest tests test_quick.py -q

  package:
    name: Build and inspect package
    needs: test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install build tools
        run: python -m pip install --upgrade build twine
      - name: Build source and wheel distributions
        run: python -m build
      - name: Validate distribution metadata
        run: python -m twine check dist/*
      - name: Verify wheel installation
        run: |
          python -m venv .wheel-test
          .wheel-test/bin/python -m pip install dist/*.whl
          .wheel-test/bin/python -c "from idt_r_optimizer import IDTROptimizer; from idt_r import IDTROptimizer as PackageOptimizer; assert IDTROptimizer is PackageOptimizer"